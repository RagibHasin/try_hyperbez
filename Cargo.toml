[package]
name = "hyperbez_toy"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
arrayvec = "0.7.6"
console_error_panic_hook = "0.1.7"
nalgebra = { version = "0.34.1", default-features = false, features = ["std"] }
num-dual = "0.12.1"
num-traits = "0.2.19"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
tracing-web = "0.1.3"
wasm-bindgen = "0.2.105"
web-sys = { version = "0.3.82", features = [
  "History",
  "Location",
  "PopStateEvent",
] }
xilem_web = { git = "https://github.com/linebender/xilem.git", rev = "11e59fd0ceefc0909cc46c605ed04036390c97ce" }

[dev-dependencies]
test-log = { version = "0.2.18", default-features = false, features = [
  "trace",
  "unstable",
] }
