[package]
name = "hyperbez_toy"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
arrayvec = "0.7.8"
console_error_panic_hook = "0.1.7"
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
num-dual = "0.15.0"
num-traits = "0.2.19"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-web = "0.1.3"
wasm-bindgen = "0.2.127"
web-sys = { version = "0.3.104", features = [
  "History",
  "Location",
  "PopStateEvent",
] }
xilem_web = { git = "https://github.com/linebender/xilem.git", rev = "ef3b6094ede784d6df5dbdfa72d67e8280a9c619" }

[dev-dependencies]
test-log = { version = "0.2.21", default-features = false, features = [
  "trace",
  "unstable",
] }
